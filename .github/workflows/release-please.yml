name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A newer push to main supersedes an in-flight run. Letting a stale run finish
# makes Release Please write package.json from an old read of main, and it never
# rewrites an unchanged release PR afterwards.
concurrency:
  group: release-please
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Generate Deploy Bot token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPLOYMENT_APP_ID }}
          private-key: ${{ secrets.DEPLOYMENT_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # App token so the repair step can push a branch that triggers CI.
          token: ${{ steps.generate-token.outputs.token }}
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Safety net if a stale write still gets through: see the script header.
      - name: Repair release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash .github/scripts/repair-release-branch.sh
