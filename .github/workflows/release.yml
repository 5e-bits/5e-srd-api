name: Release

on:
  release:
    types: [published]
  repository_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  route:
    name: Determine Release Target
    runs-on: ubuntu-latest
    if: github.repository == '5e-bits/5e-srd-api'
    outputs:
      is-database: ${{ steps.route.outputs.is-database }}
      tag: ${{ steps.route.outputs.tag }}
    steps:
      - name: Determine Release Target
        id: route
        run: |
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" == 5e-database-v* ]]; then
            echo "is-database=true" >> $GITHUB_OUTPUT
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" == 5e-srd-api-v* ]]; then
            echo "is-database=false" >> $GITHUB_OUTPUT
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            # repository_dispatch (the old 5e-bits/5e-database repo notifying
            # us) or any other unrecognized release: redeploy the latest
            # apps/api release. api-release.yml resolves that itself when no
            # tag is given.
            echo "is-database=false" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
          fi

  api:
    name: API Release
    needs: [route]
    if: needs.route.outputs.is-database == 'false'
    uses: ./.github/workflows/api-release.yml
    with:
      tag: ${{ needs.route.outputs.tag }}
    secrets: inherit

  database:
    name: Database Release
    needs: [route]
    if: needs.route.outputs.is-database == 'true'
    uses: ./.github/workflows/database-release.yml
    with:
      tag: ${{ needs.route.outputs.tag }}
    secrets: inherit

  redeploy-api:
    name: Redeploy API (database release)
    runs-on: ubuntu-latest
    needs: [route, database]
    if: needs.route.outputs.is-database == 'true'
    permissions:
      contents: read
      packages: read
    steps:
      - name: Resolve latest apps/api version
        id: tag
        run: |
          TAG=$(gh api repos/${{ github.repository }}/releases --jq '[.[] | select(.tag_name | startswith("5e-srd-api-v"))][0].tag_name')
          echo "version=${TAG#5e-srd-api-}" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # apps/api's own source hasn't changed, so this reuses whatever image
      # container-release last published instead of rebuilding it -- a
      # database release only needs the running service bounced, matching
      # the old 5e-bits/5e-database repo's repository_dispatch behavior.
      - uses: ./.github/actions/heroku-deploy
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.tag.outputs.version }}
          heroku-app: dnd-5e-srd-api
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          heroku-api-key: ${{ secrets.HEROKU_API_KEY }}
