services:
  db:
    image: ghcr.io/5e-bits/5e-database:latest
    # build:
    #   context: ../..
    #   dockerfile: packages/5e-database/Dockerfile
    ports:
      - '27017:27017'

  cache:
    image: redis:6.2.5
    ports:
      - '6379:6379'

  api:
    environment:
      MONGODB_URI: mongodb://db/5e-database
      REDIS_URL: redis://cache:6379
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - db
      - cache
