rule-model:
  description: |
    `Rule`
  allOf:
    - $ref: './combined.yml#/APIReference'
    - type: object
      properties:
        desc:
          description: Text under the rule heading, before any child rules. Omitted for headings with no text of their own.
          type: string
        parent:
          description: The rule this rule is nested under. Omitted for top-level rules.
          $ref: './combined.yml#/APIReference'
        children:
          description: Rules nested under this rule, in SRD order. Omitted when there are none.
          type: array
          items:
            $ref: './combined.yml#/APIReference'
