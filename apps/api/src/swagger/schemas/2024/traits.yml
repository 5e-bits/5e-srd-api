trait-model:
  allOf:
    - $ref: './combined.yml#/SrdResource'
    - type: object
      properties:
        description:
          type: string
        species:
          type: array
          items:
            $ref: './common.yml#/api-ref-model-2024'
        subspecies:
          type: array
          items:
            $ref: './common.yml#/api-ref-model-2024'
        proficiency_choices:
          $ref: './common.yml#/choice-model-2024'
        speed:
          type: number
          description: 'Speed override granted by this trait.'
