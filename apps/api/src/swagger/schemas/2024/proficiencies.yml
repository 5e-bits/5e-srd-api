proficiency-model:
  allOf:
    - $ref: './combined.yml#/SrdResource'
    - type: object
      properties:
        type:
          type: string
          description: 'The type of proficiency (e.g., Skills, Tools, Armor, Weapons).'
        backgrounds:
          type: array
          items:
            $ref: './common.yml#/api-ref-model-2024'
        classes:
          type: array
          items:
            $ref: './common.yml#/api-ref-model-2024'
        reference:
          description: 'The referenced skill or tool, if this proficiency wraps one.'
          $ref: './common.yml#/api-ref-model-2024'
