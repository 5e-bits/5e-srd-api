background-feat-reference-model:
  type: object
  properties:
    index:
      type: string
    name:
      type: string
    url:
      type: string
    note:
      type: string

background-model-2024:
  allOf:
    - $ref: './combined.yml#/SrdResource'
    - type: object
      properties:
        ability_scores:
          type: array
          items:
            $ref: './common.yml#/api-ref-model-2024'
        feat:
          $ref: '#/background-feat-reference-model'
        proficiencies:
          type: array
          items:
            $ref: './common.yml#/api-ref-model-2024'
        proficiency_choices:
          type: array
          items:
            $ref: './common.yml#/choice-model-2024'
        equipment_options:
          type: array
          items:
            $ref: './common.yml#/choice-model-2024'
