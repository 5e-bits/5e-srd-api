subclass-feature-model:
  type: object
  properties:
    name:
      type: string
    level:
      type: integer
      description: 'The character level at which this feature is gained.'
    description:
      type: string

subclass-model-2024:
  allOf:
    - $ref: './combined.yml#/SrdResource'
    - type: object
      properties:
        class:
          $ref: './common.yml#/api-ref-model-2024'
        summary:
          type: string
        description:
          type: string
        features:
          type: array
          items:
            $ref: '#/subclass-feature-model'
